[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-tool"
version = "0.1.0"
description = "Retrospective clinical research tool with outcome-masking and provenance"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "lifelines>=0.27",
    "tableone>=0.8",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
research-tool = "core.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
